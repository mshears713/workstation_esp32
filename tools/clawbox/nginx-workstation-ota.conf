# WORKSTATION firmware distribution.
#
# Separate from the application backend on :8000 on purpose. Application
# traffic is plain HTTP on a trusted LAN and stays that way; firmware is code
# the device will execute, so it comes over TLS with a certificate the device
# has compiled in (main/certs/clawbox_ota_ca.pem in the firmware repo). The
# device additionally checks the image against the SHA-256 in the manifest,
# so a correct install requires both the right server and the right bytes.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name clawbox.local clawbox;

    ssl_certificate     /opt/workstation/tls/clawbox_ota.crt;
    ssl_certificate_key /opt/workstation/tls/clawbox_ota.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Small TLS records. The ESP32-S3 has plenty of PSRAM but very little
    # internal RAM, which is where mbedTLS' buffers live; 16K records are a
    # real cause of handshake failures on this class of device.
    ssl_buffer_size 4k;

    access_log /var/log/nginx/workstation-ota-access.log;
    error_log  /var/log/nginx/workstation-ota-error.log;

    # Private networks only. This endpoint hands out executable firmware and
    # has no business answering anything routable from outside the LAN.
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 127.0.0.1;
    deny  all;

    # The deploy pointer. Written only by `workstation deploy`; building and
    # publishing never touch it. The device reads this once a minute and
    # appends its own state to the query string, which is how the access log
    # doubles as the device's status report (see `workstation status`).
    location = /api/v1/firmware/desired {
        alias /opt/workstation/artifacts/desired.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location /firmware/ {
        alias /opt/workstation/artifacts/bin/;
        default_type application/octet-stream;
        autoindex off;
    }

    location / { return 404; }
}
